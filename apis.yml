name: Layer3
description: 'Layer3 is a consumer crypto platform that bills itself as a gateway to the onchain economy,
  combining a gasless smart wallet with curated protocol "Activations" where users complete onchain tasks
  to earn CUBE rewards and the L3 token. It spans 40+ chains and 500+ applications, adds trading, staking,
  competitions, perks, and social features, and offers a Builder product that lets protocols launch
  incentivized activations, set up a Space, and distribute token rewards. It is backed by Electric Capital.
  No public developer API, OpenAPI specification, or SDK surface was found during enrichment; the docs at
  docs.layer3.xyz cover the end-user Platform and no-code Builder products only.'
